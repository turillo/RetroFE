name: Windows Package
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build Windows

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GStreamer
        shell: pwsh
        run: |
          $base = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc'
          foreach ($m in 'gstreamer-1.0-msvc-x86_64-1.24.13.msi','gstreamer-1.0-devel-msvc-x86_64-1.24.13.msi') {
            Invoke-WebRequest "$base/$m" -OutFile "$env:RUNNER_TEMP\$m"
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i',"`"$env:RUNNER_TEMP\$m`"",'/qn','ADDLOCAL=ALL','INSTALLDIR=D:\gstreamer'
            if ($p.ExitCode -ne 0) { throw "msiexec $m exit $($p.ExitCode)" }
          }
          $root = (Get-ChildItem D:\gstreamer -Recurse -Filter gstreamer-1.0.lib | Select-Object -First 1).Directory.Parent.FullName
          if (-not $root) { throw 'GStreamer root not found' }
          "GSTREAMER_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "GStreamer root: $root"

      - name: Configure environment
        run: |
          cmake -A x64 -B .\RetroFE\Build -D GSTREAMER_ROOT=$env:GSTREAMER_ROOT -S .\RetroFE\Source

      - name: Build RetroFE
        run: |
          cmake --build RetroFE/Build --config Release

      - name: Copy DLLs and prepare package
        run: |
          mkdir .\RetroFE\Build\Release\retrofe
          xcopy /S /I /Y .\Package\Environment\Windows\retrofe .\RetroFE\Build\Release\retrofe
          move .\RetroFE\Build\Release\retrofe.exe .\RetroFE\Build\Release\retrofe\retrofe.exe
          copy .\Package\Environment\Windows\RetroFE.lnk .\RetroFE\Build\Release

      - name: Upload RetroFE
        uses: actions/upload-artifact@v4
        with:
          name: RetroFE-windows
          path: |
            D:\a\RetroFE\RetroFE\RetroFE\Build\Release\retrofe
            D:\a\RetroFE\RetroFE\RetroFE\Build\Release\RetroFE.lnk

